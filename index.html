<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Search Console HTML-ownership verification for www.travioghana.com.
         Google's fetcher identifies as Googlebot, and this repo serves crawlers
         the build-time prerender rather than this file, so what GSC actually
         reads is dist/__seo/index.html — which inherits this <head> (the
         manifest, theme-color and preconnect tags all survive the prerender).
         Verified present in the prerendered output of all 20 routes, which is
         harmless: GSC only reads it from the domain root, and this shell <head>
         is the single source every prerendered page is built from.
         Delete once GSC reports the property as verified. -->
    <meta name="google-site-verification" content="ZSON1kHi17YrGQoqR3qgfw9sE8jgVmfePnmtT2EYWYs" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Icons. The /icons/v2/ paths are versioned because browsers cache
         favicons in their own stores keyed by URL, not by Cache-Control: a new
         path is the only way to be sure nobody is shown the retired mark. The
         same artwork also ships at the legacy root paths for probes and old
         references, and the whole set is generated by `npm run
         generate-favicons` + verified by scripts/check-icons.cjs. The links
         below are mirrored from scripts/icon-links.cjs. -->
    <link rel="icon" sizes="any" href="/icons/v2/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/v2/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/v2/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/v2/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/v2/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/v2/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/v2/android-chrome-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/v2/apple-touch-icon.png" />
    <meta name="theme-color" content="#F8F8F0" />
    <!-- Install/app metadata. Its strings are brand-facing too: the manifest is
         a public file, so it names Travio Ghana rather than Expedition-Go. -->
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Everything a crawler parses — description, canonical, robots, og:*,
         twitter:* and JSON-LD — is emitted per page by src/components/SEO.tsx.
         None of it is hardcoded here: a static copy survived hydration and gave
         every page two conflicting values (2x og:title, 2x og:image, 4 JSON-LD),
         which scrapers resolve by taking the stale one. The <title> stays so the
         tab is labelled before React mounts; Helmet updates it in place. -->
    <title>Ghana Tours &amp; Activities | Discover &amp; Book | Travio Ghana</title>
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="dns-prefetch" href="https://tiles.openfreemap.org" />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://apiv1.travioafrica.com" crossorigin />
    <link rel="dns-prefetch" href="https://apiv1.travioafrica.com" />
    <link rel="preload" href="/fonts/manrope-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dmsans-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <!-- Google Analytics (GA4, G-JMH0ZKFYB8).
         The tag is static on purpose. Google's tag setup detects the tag by
         fetching the page, and a fetch carries no cookie-consent choice, so a
         tag that only injects after opt-in is never seen; the CSP also allows
         no inline scripts, so the bootstrap cannot live here either.
         Consent Mode v2 defaults every category to "denied", so no analytics
         cookie is set and no user-level data is collected until the visitor
         allows analytics cookies. src/lib/googleAnalytics.ts owns the
         behaviour: it queues the consent and config calls (config sets
         send_page_view off), grants storage on opt-in, revokes and clears the
         _ga cookies on withdrawal, and reports one page_view per SPA route. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JMH0ZKFYB8"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
