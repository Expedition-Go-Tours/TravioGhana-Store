name: Sync External Reviews
on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 6 AM UTC
  workflow_dispatch:        # Manual trigger button in GitHub UI

# The job pushes the refreshed reviews file back to main; the default
# GITHUB_TOKEN is read-only on new repos, so request write explicitly.
permissions:
  contents: write

# Never let a manual run and the nightly cron overlap on the same dataset.
concurrency:
  group: sync-reviews
  cancel-in-progress: false

jobs:
  sync-reviews:
    runs-on: ubuntu-latest
    # Deep scrape (100 pages x 14 tours with polite delays) can run for hours;
    # cap it so a hung run cannot occupy a runner all day.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Puppeteer 25 requires Node >= 22.12 (ESM-only, engines.node).
          node-version: 24

      - name: Install Puppeteer
        # Pin the version: an unpinned install drifts to newer majors whose
        # Node engine requirement can silently outpace the runner.
        run: npm install --no-save puppeteer@25.11.0

      - name: Run sync script
        # .cjs extension: package.json has "type": "module", so a .js file
        # here is parsed as ESM and crashes instantly on require()/__dirname.
        env:
          # Push the scraped official totals to the backend so homepage ranking
          # counts external reviews. The token lives in repo secrets.
          EXTERNAL_REVIEWS_SYNC_URL: https://apiv1.travioafrica.com/api/admin/external-reviews/sync
          EXTERNAL_REVIEWS_SYNC_TOKEN: ${{ secrets.EXTERNAL_REVIEWS_SYNC_TOKEN }}
          # Optional residential proxy: TripAdvisor 403s datacenter IPs, so its
          # reviews only come back through a proxy. Blank = no proxy.
          REVIEWS_PROXY_SERVER: ${{ secrets.REVIEWS_PROXY_SERVER }}
          REVIEWS_PROXY_USERNAME: ${{ secrets.REVIEWS_PROXY_USERNAME }}
          REVIEWS_PROXY_PASSWORD: ${{ secrets.REVIEWS_PROXY_PASSWORD }}
        run: node scripts/sync-reviews.cjs

      - name: Commit updated reviews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The script writes public/data/... — src/data/ holds only mocks, so
          # the old path staged nothing and every run was a no-op.
          git add public/data/externalReviews.json public/data/externalReviewStats.json
          git diff --staged --quiet || git commit -m "chore: sync external reviews [skip ci]"
          # Land on top of anything merged since checkout instead of failing
          # with a non-fast-forward rejection.
          git pull --rebase
          git push

      - name: Notify on failure
        # A blocked scrape is expected sometimes; a *silent* one is not.
        if: failure()
        env:
          DISCORD_SYNC_WEBHOOK: ${{ secrets.DISCORD_SYNC_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_SYNC_WEBHOOK" ]; then
            echo "DISCORD_SYNC_WEBHOOK not set — skipping notification"
            exit 0
          fi
          curl -sS -X POST "$DISCORD_SYNC_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"content\":\"⚠️ External reviews sync failed — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
